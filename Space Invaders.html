<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders-Arcade Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background-color: #000000;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 600;

    const game = {
      player: { x: 400, y: 540, width: 40, height: 20 },
      keys: {},
      lives: 3,
      gameOver: false,
      gameWon: false,
      invaders: [],
      invaderDirection: 1,
      invaderSpeed: 2.5,
      invaderDropDistance: 40,
      bullets: [],
      invaderBullets: [],
      barriers: [],
      score: 0,
      shootCounter: 0,
      stars: []
    };

    for (let i = 0; i < 100; i++) {
      game.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 1 + 0.5
      });
    }

    function createInvaders() {
      game.invaders = [];
      const startX = 80;
      const startY = 40;
      const spacingX = 60;
      const spacingY = 50;

      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 8; col++) {
          game.invaders.push({
            x: startX + col * spacingX,
            y: startY + row * spacingY,
            width: 34,
            height: 24,
            type: row % 3
          });
        }
      }
    }

    function createBarriers() {
      game.barriers = [];
      const barrierCount = 4;
      const blockWidth = 12;
      const blockHeight = 12;
      const barrierY = 420;
      const barrierSpacing = 170;
      const startX = 80;

      for (let b = 0; b < barrierCount; b++) {
        const barrier = { blocks: [] };
        const barrierStartX = startX + b * barrierSpacing;

        for (let row = 0; row < 4; row++) {
          for (let col = 0; col < 6; col++) {
            if ((row === 0 && (col === 0 || col === 5)) || 
                (row === 3 && (col === 2 || col === 3))) {
              continue;
            }
            barrier.blocks.push({
              x: barrierStartX + col * blockWidth,
              y: barrierY + row * blockHeight,
              width: blockWidth,
              height: blockHeight,
              health: 3
            });
          }
        }
        game.barriers.push(barrier);
      }
    }

    createInvaders();
    createBarriers();

    document.addEventListener('keydown', (event) => {
      game.keys[event.key] = true;
      if (event.key === 'Enter' && (game.gameOver || game.gameWon)) restartGame();
      if (event.key === ' ' && !game.gameOver) {
        if (game.bullets.length < 3) {
          game.bullets.push({
            x: game.player.x + game.player.width / 2 - 2,
            y: game.player.y - 10,
            width: 4, height: 15
          });
        }
      }
    });

    document.addEventListener('keyup', (event) => {
      game.keys[event.key] = false;
    });

    function isColliding(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
    }

    function update() {
      for (let star of game.stars) {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      }

      if (game.keys['ArrowLeft']) game.player.x -= 5;
      if (game.keys['ArrowRight']) game.player.x += 5;
      game.player.x = Math.max(0, Math.min(canvas.width - game.player.width, game.player.x));

      let shouldDropDown = false;
      for (let invader of game.invaders) {
        invader.x += game.invaderSpeed * game.invaderDirection;
        if ((game.invaderDirection === 1 && invader.x + invader.width >= canvas.width - 20) ||
            (game.invaderDirection === -1 && invader.x <= 20)) {
          shouldDropDown = true;
        }
        if (invader.y + invader.height >= canvas.height - 50) game.gameOver = true;
      }

      if (shouldDropDown) {
        game.invaderDirection *= -1;
        for (let invader of game.invaders) invader.y += game.invaderDropDistance;
      }

      game.shootCounter++;
      if (game.shootCounter > 40 && game.invaders.length > 0) {
        const randomInvader = game.invaders[Math.floor(Math.random() * game.invaders.length)];
        game.invaderBullets.push({
          x: randomInvader.x + randomInvader.width / 2 - 2,
          y: randomInvader.y + randomInvader.height,
          width: 4, height: 15
        });
        game.shootCounter = 0;
      }

      for (let i = game.bullets.length - 1; i >= 0; i--) {
        game.bullets[i].y -= 8;
        if (game.bullets[i].y < 0) game.bullets.splice(i, 1);
      }
      for (let i = game.invaderBullets.length - 1; i >= 0; i--) {
        game.invaderBullets[i].y += 5;
        if (game.invaderBullets[i].y > canvas.height) game.invaderBullets.splice(i, 1);
      }

      for (let b = game.bullets.length - 1; b >= 0; b--) {
        let hit = false;
        for (let barrier of game.barriers) {
          for (let blockIdx = barrier.blocks.length - 1; blockIdx >= 0; blockIdx--) {
            if (isColliding(game.bullets[b], barrier.blocks[blockIdx])) {
              barrier.blocks[blockIdx].health -= 1;
              if (barrier.blocks[blockIdx].health <= 0) barrier.blocks.splice(blockIdx, 1);
              hit = true; break;
            }
          }
          if (hit) break;
        }
        if (hit) { game.bullets.splice(b, 1); continue; }

        for (let i = game.invaders.length - 1; i >= 0; i--) {
          if (isColliding(game.bullets[b], game.invaders[i])) {
            game.bullets.splice(b, 1);
            game.invaders.splice(i, 1);
            game.score += 10;
            break;
          }
        }
      }

      for (let b = game.invaderBullets.length - 1; b >= 0; b--) {
        let hit = false;
        for (let barrier of game.barriers) {
          for (let blockIdx = barrier.blocks.length - 1; blockIdx >= 0; blockIdx--) {
            if (isColliding(game.invaderBullets[b], barrier.blocks[blockIdx])) {
              barrier.blocks[blockIdx].health -= 3;
              if (barrier.blocks[blockIdx].health <= 0) barrier.blocks.splice(blockIdx, 1);
              hit = true; break;
            }
          }
          if (hit) break;
        }
        if (hit) { game.invaderBullets.splice(b, 1); continue; }

        if (isColliding(game.invaderBullets[b], game.player)) {
          game.invaderBullets.splice(b, 1);
          game.lives--;
          if (game.lives <= 0) game.gameOver = true;
        }
      }

      if (game.invaders.length === 0) game.gameWon = true;
    }

    function render() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#FFFFFF';
      for (let star of game.stars) {
        ctx.globalAlpha = star.speed / 2;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
      ctx.globalAlpha = 1.0;

      ctx.fillStyle = '#00FF41';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00FF41';
      ctx.fillRect(game.player.x, game.player.y + 10, game.player.width, 10);
      ctx.fillRect(game.player.x + 16, game.player.y, 8, 10);
      ctx.fillRect(game.player.x - 4, game.player.y + 15, 6, 5);
      ctx.fillRect(game.player.x + game.player.width - 2, game.player.y + 15, 6, 5);
      ctx.shadowBlur = 0;

      for (let invader of game.invaders) {
        if (invader.type === 0) ctx.fillStyle = '#FF0055';
        else if (invader.type === 1) ctx.fillStyle = '#00E5FF';
        else ctx.fillStyle = '#FFEA00';
        
        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
        
        ctx.fillStyle = '#000000';
        ctx.fillRect(invader.x + 6, invader.y + 6, 6, 6);
        ctx.fillRect(invader.x + invader.width - 12, invader.y + 6, 6, 6);
        ctx.fillRect(invader.x + 10, invader.y + 16, invader.width - 20, 4);
      }

      for (let barrier of game.barriers) {
        for (let block of barrier.blocks) {
          if (block.health === 3) ctx.fillStyle = '#00FFFF';
          else if (block.health === 2) ctx.fillStyle = '#008888';
          else ctx.fillStyle = '#004444';
          
          ctx.fillRect(block.x, block.y, block.width - 1, block.height - 1);
        }
      }

      ctx.shadowBlur = 8;
      ctx.fillStyle = '#00FF00';
      ctx.shadowColor = '#00FF00';
      for (let b of game.bullets) ctx.fillRect(b.x, b.y, b.width, b.height);

      ctx.fillStyle = '#FF0000';
      ctx.shadowColor = '#FF0000';
      for (let b of game.invaderBullets) ctx.fillRect(b.x, b.y, b.width, b.height);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(`LIVES: ${game.lives}`, 20, 30);
      ctx.fillText(`SCORE: ${game.score}`, canvas.width - 140, 30);

      if (game.gameOver || game.gameWon) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.textAlign = 'center';
        ctx.font = 'bold 50px monospace';
        ctx.fillStyle = game.gameWon ? '#00FF00' : '#FF0000';
        ctx.shadowBlur = 20;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillText(game.gameWon ? 'VICTORY' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '20px monospace';
        ctx.fillText(`FINAL SCORE: ${game.score}`, canvas.width / 2, canvas.height / 2 + 30);
        
        if (Math.floor(Date.now() / 500) % 2 === 0) {
            ctx.fillStyle = '#FFFF00';
            ctx.fillText('PRESS ENTER TO PLAY AGAIN', canvas.width / 2, canvas.height / 2 + 80);
        }
        ctx.textAlign = 'left';
      }
    }

    function restartGame() {
      game.player.x = 400;
      game.lives = 3;
      game.score = 0;
      game.gameOver = false;
      game.gameWon = false;
      game.bullets = [];
      game.invaderBullets = [];
      createInvaders();
      createBarriers();
    }

    let lastTime = 0;
    const FPS = 60;
    const frameDelay = 1000 / FPS;

    function gameLoop(currentTime) {
      requestAnimationFrame(gameLoop);

      const deltaTime = currentTime - lastTime;

      if (deltaTime >= frameDelay) {
        lastTime = currentTime - (deltaTime % frameDelay); 

        if (!game.gameOver && !game.gameWon) {
          update();
        }
        render();
      }
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
